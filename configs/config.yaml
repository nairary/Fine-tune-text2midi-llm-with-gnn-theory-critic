defaults:
  - model: teacher_gnn_base
  - data: teacher_encoded_full
  - dataloader: baseline
  - training: default
  - optimizer: adamw
  - scheduler: none
  - losses: teacher_ssl
  - experiment: baseline
  - hydra: default
  - _self_

project:
  name: Fine-tune-text2midi-llm-with-gnn-theory-critic
  task: teacher_ssl_training

run_name: ${experiment.name}_${model.name}
seed: ${training.seed}
device: ${training.device}

wandb:
  enabled: false
  project: theory_critic
  entity: null
  mode: online
  log_train_metrics: true
  log_val_metrics: true
  log_diagnostics: true
  diagnostics_split: val
  diagnostics_every_epochs: 1
  diagnostics_max_scan_batches: null
  max_diagnostic_samples: 2
  log_artifacts: true
  artifact_examples_limit: 2
